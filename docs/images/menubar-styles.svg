<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350"
     font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="840" height="350" rx="16" fill="#171614"/>
  <text x="32" y="38" fill="#A9A29A" font-size="13" letter-spacing="0.4">메뉴바 표시 — 여섯 가지 디자인</text>
  <text x="32" y="58" fill="#6E675E" font-size="11">5시간 창 62% 소진 · 창에서 42% 경과한 상태를 그린 것</text>

  <!-- ── 1. 이중 링 (기본) ───────────────────────────── -->
  <rect x="60" y="88" width="160" height="34" rx="8" fill="#2C2926"/>
  <text x="105" y="110" fill="#FBF8F3" font-size="14" font-weight="600">62%</text>
  <circle cx="162" cy="105" r="10" fill="none" stroke="#3A3632" stroke-width="3"/>
  <circle cx="162" cy="105" r="10" fill="none" stroke="#D97757" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="38.96 62.84" transform="rotate(-90 162 105)"/>
  <circle cx="162" cy="105" r="5.5" fill="none" stroke="#2A2724" stroke-width="2"/>
  <circle cx="162" cy="105" r="5.5" fill="none" stroke="#5C999E" stroke-width="2" stroke-linecap="round"
          stroke-dasharray="14.51 34.56" transform="rotate(-90 162 105)"/>
  <text x="140" y="146" fill="#FBF8F3" font-size="13" font-weight="600" text-anchor="middle">이중 링 <tspan fill="#D97757" font-size="10">기본</tspan></text>
  <text x="140" y="164" fill="#6E675E" font-size="11" text-anchor="middle">바깥 = 소진율, 안쪽 = 지난 시간</text>

  <!-- ── 2. 링 ───────────────────────────────────────── -->
  <rect x="340" y="88" width="160" height="34" rx="8" fill="#2C2926"/>
  <text x="385" y="110" fill="#FBF8F3" font-size="14" font-weight="600">62%</text>
  <circle cx="442" cy="105" r="10" fill="none" stroke="#3A3632" stroke-width="3"/>
  <circle cx="442" cy="105" r="10" fill="none" stroke="#D97757" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="38.96 62.84" transform="rotate(-90 442 105)"/>
  <text x="420" y="146" fill="#FBF8F3" font-size="13" font-weight="600" text-anchor="middle">링</text>
  <text x="420" y="164" fill="#6E675E" font-size="11" text-anchor="middle">소진율만</text>

  <!-- ── 3. 링 + 내부 숫자 ───────────────────────────── -->
  <rect x="620" y="88" width="160" height="34" rx="8" fill="#2C2926"/>
  <circle cx="700" cy="105" r="11" fill="none" stroke="#3A3632" stroke-width="3"/>
  <circle cx="700" cy="105" r="11" fill="none" stroke="#D97757" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="42.85 69.12" transform="rotate(-90 700 105)"/>
  <text x="700" y="109" fill="#FBF8F3" font-size="9" font-weight="700" text-anchor="middle">62</text>
  <text x="700" y="146" fill="#FBF8F3" font-size="13" font-weight="600" text-anchor="middle">링 + 내부 숫자</text>
  <text x="700" y="164" fill="#6E675E" font-size="11" text-anchor="middle">메뉴바 폭을 가장 적게 씁니다</text>

  <!-- ── 4. 막대 ─────────────────────────────────────── -->
  <rect x="60" y="218" width="160" height="34" rx="8" fill="#2C2926"/>
  <text x="90" y="240" fill="#FBF8F3" font-size="14" font-weight="600">62%</text>
  <rect x="136" y="228" width="58" height="5" rx="2.5" fill="#3A3632"/>
  <rect x="136" y="228" width="36" height="5" rx="2.5" fill="#D97757"/>
  <rect x="136" y="239" width="58" height="3" rx="1.5" fill="#2A2724"/>
  <rect x="136" y="239" width="24" height="3" rx="1.5" fill="#5C999E"/>
  <text x="140" y="276" fill="#FBF8F3" font-size="13" font-weight="600" text-anchor="middle">막대</text>
  <text x="140" y="294" fill="#6E675E" font-size="11" text-anchor="middle">위 = 소진율, 아래 = 지난 시간</text>

  <!-- ── 5. 게이지 ───────────────────────────────────── -->
  <rect x="340" y="218" width="160" height="34" rx="8" fill="#2C2926"/>
  <text x="385" y="240" fill="#FBF8F3" font-size="14" font-weight="600">62%</text>
  <path d="M 432 241 A 11 11 0 1 1 452 241" fill="none" stroke="#6E675E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="442" y1="236" x2="448.5" y2="228" stroke="#FBF8F3" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="442" cy="236" r="1.8" fill="#FBF8F3"/>
  <text x="420" y="276" fill="#FBF8F3" font-size="13" font-weight="600" text-anchor="middle">게이지</text>
  <text x="420" y="294" fill="#6E675E" font-size="11" text-anchor="middle">단색 — 메뉴바 색을 그대로 따릅니다</text>

  <!-- ── 6. 숫자만 ───────────────────────────────────── -->
  <rect x="620" y="218" width="160" height="34" rx="8" fill="#2C2926"/>
  <text x="700" y="240" fill="#FBF8F3" font-size="14" font-weight="600" text-anchor="middle">62%</text>
  <text x="700" y="276" fill="#FBF8F3" font-size="13" font-weight="600" text-anchor="middle">숫자만</text>
  <text x="700" y="294" fill="#6E675E" font-size="11" text-anchor="middle">텍스트만</text>

  <!-- ── 범례 ────────────────────────────────────────── -->
  <line x1="32" y1="316" x2="808" y2="316" stroke="#2C2926" stroke-width="1"/>
  <rect x="32" y="330" width="18" height="5" rx="2.5" fill="#D97757"/>
  <text x="58" y="339" fill="#A9A29A" font-size="11">사용량(소진율) — 70% 주황, 90% 빨강으로 갈라집니다</text>
  <rect x="420" y="331" width="18" height="3" rx="1.5" fill="#5C999E"/>
  <text x="446" y="339" fill="#A9A29A" font-size="11">창에서 지난 시간 — 한 톤, 경고 단계 없음</text>
</svg>
