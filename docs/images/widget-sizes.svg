<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"
     font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="720" height="300" rx="16" fill="#171614"/>
  <text x="32" y="38" fill="#A9A29A" font-size="13" letter-spacing="0.4">위젯 크기별 배치</text>
  <text x="32" y="58" fill="#6E675E" font-size="11">높이가 155pt뿐이라 세 개를 세로로 쌓으면 잘립니다 — 중간 크기는 두 열로 나눕니다</text>

  <!-- ── 작은 위젯 155×155 ──────────────────────────── -->
  <rect x="40" y="86" width="155" height="155" rx="22" fill="#232120"/>
  <text x="58" y="110" fill="#D97757" font-size="11" font-weight="700">✦ Claude</text>

  <text x="58" y="136" fill="#A9A29A" font-size="9">5시간 창</text>
  <text x="177" y="136" fill="#FBF8F3" font-size="11" font-weight="700" text-anchor="end">62%</text>
  <rect x="58" y="142" width="119" height="4" rx="2" fill="#3A3632"/>
  <rect x="58" y="142" width="74" height="4" rx="2" fill="#D97757"/>
  <rect x="58" y="150" width="119" height="3" rx="1.5" fill="#2A2724"/>
  <rect x="58" y="150" width="50" height="3" rx="1.5" fill="#5C999E"/>
  <text x="58" y="166" fill="#6E675E" font-size="8">3h 4m 남음</text>

  <text x="58" y="188" fill="#A9A29A" font-size="9">주간</text>
  <text x="177" y="188" fill="#FBF8F3" font-size="11" font-weight="700" text-anchor="end">39%</text>
  <rect x="58" y="194" width="119" height="4" rx="2" fill="#3A3632"/>
  <rect x="58" y="194" width="46" height="4" rx="2" fill="#D97757"/>
  <rect x="58" y="202" width="119" height="3" rx="1.5" fill="#2A2724"/>
  <rect x="58" y="202" width="71" height="3" rx="1.5" fill="#5C999E"/>
  <text x="58" y="218" fill="#6E675E" font-size="8">5d 3h 남음</text>

  <text x="58" y="233" fill="#6E675E" font-size="8">✓ 14:22</text>

  <text x="117" y="265" fill="#FBF8F3" font-size="12" font-weight="600" text-anchor="middle">작은 155×155</text>
  <text x="117" y="282" fill="#6E675E" font-size="10" text-anchor="middle">한 열에 5시간 창 + 주간</text>

  <!-- ── 중간 위젯 329×155 ──────────────────────────── -->
  <rect x="250" y="86" width="329" height="155" rx="22" fill="#232120"/>
  <text x="270" y="110" fill="#D97757" font-size="11" font-weight="700">✦ Claude</text>

  <!-- 왼쪽 열 -->
  <text x="270" y="140" fill="#A9A29A" font-size="10">5시간 창</text>
  <text x="404" y="140" fill="#FBF8F3" font-size="13" font-weight="700" text-anchor="end">62%</text>
  <rect x="270" y="148" width="134" height="5" rx="2.5" fill="#3A3632"/>
  <rect x="270" y="148" width="83" height="5" rx="2.5" fill="#D97757"/>
  <rect x="270" y="157" width="134" height="3" rx="1.5" fill="#2A2724"/>
  <rect x="270" y="157" width="56" height="3" rx="1.5" fill="#5C999E"/>
  <text x="270" y="175" fill="#6E675E" font-size="9">3h 4m 남음</text>

  <!-- 오른쪽 열 -->
  <text x="425" y="140" fill="#A9A29A" font-size="10">주간</text>
  <text x="559" y="140" fill="#FBF8F3" font-size="13" font-weight="700" text-anchor="end">39%</text>
  <rect x="425" y="148" width="134" height="5" rx="2.5" fill="#3A3632"/>
  <rect x="425" y="148" width="52" height="5" rx="2.5" fill="#D97757"/>
  <rect x="425" y="157" width="134" height="3" rx="1.5" fill="#2A2724"/>
  <rect x="425" y="157" width="80" height="3" rx="1.5" fill="#5C999E"/>
  <text x="425" y="175" fill="#6E675E" font-size="9">5d 3h 남음</text>

  <line x1="414" y1="128" x2="414" y2="180" stroke="#2C2926" stroke-width="1"/>
  <text x="270" y="222" fill="#6E675E" font-size="9">✓ 14:22</text>

  <text x="414" y="265" fill="#FBF8F3" font-size="12" font-weight="600" text-anchor="middle">중간 329×155</text>
  <text x="414" y="282" fill="#6E675E" font-size="10" text-anchor="middle">두 열 — 왼쪽 5시간 창, 오른쪽 주간 (+ Max 요금제의 주간 Opus)</text>
</svg>
