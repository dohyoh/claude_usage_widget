<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 374" width="840" height="374"
     font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="840" height="374" rx="16" fill="#171614"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E675E"/>
    </marker>
  </defs>

  <text x="32" y="38" fill="#A9A29A" font-size="13" letter-spacing="0.4">설정 → 실측 사용량 (claude.ai) → 연동 계정</text>
  <text x="32" y="58" fill="#6E675E" font-size="11">버튼 하나가 세 가지를 합니다. 브라우저는 로그인이 끝났다는 신호를 주지 않으므로 앱이 지켜봅니다</text>

  <rect x="32" y="82" width="232" height="92" rx="12" fill="#232120"/>
  <circle cx="54" cy="106" r="9" fill="#D97757"/>
  <text x="54" y="110" fill="#171614" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="72" y="110" fill="#FBF8F3" font-size="12" font-weight="600">쿠키 원본 고정</text>
  <text x="52" y="134" fill="#A9A29A" font-size="11">«기본 브라우저» 로 바꿉니다 —</text>
  <text x="52" y="151" fill="#A9A29A" font-size="11">브라우저에서 고른 계정이</text>
  <text x="52" y="167" fill="#A9A29A" font-size="11">실제로 쓰이도록</text>

  <line x1="272" y1="128" x2="292" y2="128" stroke="#6E675E" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="304" y="82" width="232" height="92" rx="12" fill="#232120"/>
  <circle cx="326" cy="106" r="9" fill="#D97757"/>
  <text x="326" y="110" fill="#171614" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="344" y="110" fill="#FBF8F3" font-size="12" font-weight="600">곧바로 한 번 조회</text>
  <text x="324" y="134" fill="#A9A29A" font-size="11">이미 로그인돼 있으면</text>
  <text x="324" y="151" fill="#A9A29A" font-size="11">여기서 끝납니다 —</text>
  <text x="324" y="167" fill="#A9A29A" font-size="11">브라우저가 뜰 일도 없습니다</text>

  <line x1="544" y1="128" x2="564" y2="128" stroke="#6E675E" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="576" y="82" width="232" height="92" rx="12" fill="#232120"/>
  <circle cx="598" cy="106" r="9" fill="#D97757"/>
  <text x="598" y="110" fill="#171614" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="616" y="110" fill="#FBF8F3" font-size="12" font-weight="600">끝나는지 지켜봄</text>
  <text x="596" y="134" fill="#A9A29A" font-size="11">세션 쿠키의 <tspan fill="#5C999E">지문</tspan>이</text>
  <text x="596" y="151" fill="#A9A29A" font-size="11">바뀌면 자동으로 가져옵니다</text>
  <text x="596" y="167" fill="#6E675E" font-size="11">최대 5분 · 3초 간격</text>

  <line x1="32" y1="206" x2="808" y2="206" stroke="#2C2926" stroke-width="1"/>

  <text x="32" y="234" fill="#A9A29A" font-size="13" letter-spacing="0.4">쿠키 원본 «자동» 의 폴백 — 앱 세션을 먼저 봅니다</text>

  <rect x="32" y="254" width="220" height="60" rx="12" fill="#232120" stroke="#3A3632" stroke-width="1"/>
  <text x="142" y="281" fill="#FBF8F3" font-size="12" font-weight="600" text-anchor="middle">앱 세션</text>
  <text x="142" y="299" fill="#6E675E" font-size="10" text-anchor="middle">WKWebsiteDataStore</text>

  <line x1="260" y1="284" x2="320" y2="284" stroke="#6E675E" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="274" fill="#E0A33E" font-size="10" text-anchor="middle" font-weight="600">401</text>

  <rect x="328" y="254" width="220" height="60" rx="12" fill="#232120" stroke="#3A3632" stroke-width="1"/>
  <text x="438" y="281" fill="#FBF8F3" font-size="12" font-weight="600" text-anchor="middle">기본 브라우저</text>
  <text x="438" y="299" fill="#6E675E" font-size="10" text-anchor="middle">Chromium 계열 · Firefox</text>

  <text x="572" y="278" fill="#6E675E" font-size="11">앱 세션이 401 을 받을 때만</text>
  <text x="572" y="296" fill="#6E675E" font-size="11">브라우저로 넘어갑니다</text>

  <rect x="32" y="328" width="776" height="34" rx="10" fill="#1F1D1C" stroke="#2C2926" stroke-width="1"/>
  <text x="52" y="350" fill="#6E675E" font-size="11">429 · 5xx 는 소스를 바꾸지 않습니다 — 보이는 계정이 네트워크 사정에 흔들리면 안 됩니다.</text>
</svg>
