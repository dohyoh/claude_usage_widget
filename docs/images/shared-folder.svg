<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336"
     font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="720" height="336" rx="16" fill="#171614"/>
  <text x="32" y="38" fill="#A9A29A" font-size="13" letter-spacing="0.4">Shared 폴더를 두 타겟이 쓰는 방법</text>
  <text x="32" y="58" fill="#6E675E" font-size="11">동기화된 폴더는 한 타겟에만 붙습니다 — 같은 폴더를 가리키는 그룹을 두 개 만들었습니다</text>

  <!-- 타겟 -->
  <rect x="48" y="84" width="268" height="56" rx="12" fill="#232120" stroke="#D97757" stroke-width="1.5"/>
  <text x="182" y="108" fill="#FBF8F3" font-size="12" font-weight="700" text-anchor="middle">메뉴바 앱 타겟</text>
  <text x="182" y="126" fill="#6E675E" font-size="10" text-anchor="middle">App Sandbox OFF</text>

  <rect x="404" y="84" width="268" height="56" rx="12" fill="#232120" stroke="#5C999E" stroke-width="1.5"/>
  <text x="538" y="108" fill="#FBF8F3" font-size="12" font-weight="700" text-anchor="middle">위젯 익스텐션 타겟</text>
  <text x="538" y="126" fill="#6E675E" font-size="10" text-anchor="middle">App Sandbox ON</text>

  <!-- 타겟 ↔ 그룹 -->
  <line x1="182" y1="140" x2="182" y2="186" stroke="#3A3632" stroke-width="1.5"/>
  <line x1="538" y1="140" x2="538" y2="186" stroke="#3A3632" stroke-width="1.5"/>

  <!-- 그룹 -->
  <rect x="82" y="186" width="200" height="44" rx="10" fill="#2C2926"/>
  <text x="182" y="205" fill="#A9A29A" font-size="11" text-anchor="middle">동기화된 그룹</text>
  <text x="182" y="221" fill="#6E675E" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">…0000A1</text>

  <rect x="438" y="186" width="200" height="44" rx="10" fill="#2C2926"/>
  <text x="538" y="205" fill="#A9A29A" font-size="11" text-anchor="middle">동기화된 그룹</text>
  <text x="538" y="221" fill="#6E675E" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">…0000A2</text>

  <!-- 그룹 → Shared/ -->
  <path d="M 182 230 L 182 252 L 300 252 L 300 268" fill="none" stroke="#3A3632" stroke-width="1.5"/>
  <path d="M 538 230 L 538 252 L 420 252 L 420 268" fill="none" stroke="#3A3632" stroke-width="1.5"/>

  <rect x="240" y="268" width="240" height="28" rx="8" fill="#232120" stroke="#3A3632" stroke-width="1"/>
  <text x="360" y="287" fill="#FBF8F3" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Shared/</text>

  <text x="360" y="322" fill="#6E675E" font-size="10.5" text-anchor="middle">Shared/ 에 파일을 새로 넣으면 두 타겟에 자동으로 들어갑니다 — pbxproj 를 손댈 필요가 없습니다</text>
</svg>
